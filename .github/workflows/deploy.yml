name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  schedule:
    # Rebuild semanal para manter o yt-dlp atualizado
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BINARIO: downloadanyvideo-backend
  RELEASE_TAG: latest-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-dav-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dav-

      - name: Build release binary
        run: |
          cargo build --release --locked --manifest-path backend/Cargo.toml
          cp "backend/target/release/${BINARIO}" "backend/${BINARIO}"

      - name: Publish binary as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --title "latest build" --notes "binario do backend publicado pelo CI"
          gh release upload "$RELEASE_TAG" "backend/${BINARIO}" -R "$GITHUB_REPOSITORY" --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # A chave tem forced command no servidor (/usr/local/bin/deploy-downloadanyvideo):
      # a VPS baixa o binario do release, builda a imagem de runtime e sobe o compose.
      - name: Deploy via forced command
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$USER@$HOST"
